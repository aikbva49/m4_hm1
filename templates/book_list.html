<h1>Список всех книг</h1>

 <form action="" method="get">
    <input type="text" name="q" placeholder="Поиск...">
    <button type="submit">Найти</button>
</form>

{% for i in books %}

<h2>{{ i.title }}</h2>
<img src="{{ i.image.url }}" alt="{{ i.title }}" width="150">
<p>Автор: {{ i.author }}</p>
<p>Жанр: {{ i.genre }}</p>

<a href="/book_detail/{{ i.id }}/">Подробнее</a>

{% endfor %}
